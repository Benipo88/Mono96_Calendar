<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MONO96 Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,700..900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* MONO96：白い紙に黒いインクだけ。太くつまった文字を、すきまなく重ねる。いつも白地に黒字 */
:root{
  --paper:#ffffff; --ink:#111111; --sub:#5f5f5f; --line:#d4d4d4; --soft:#f2f2f2; --mark:rgba(0,0,0,.11); --wk:#5c5c5c; --band:#dcdcdc; --sheet:#ffffff; --hi:#ffffff; --sh:rgba(0,0,0,.16); --sh2:rgba(0,0,0,.08);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --btn1:#ffffff; --btn2:#ececec; --bd:#d9d9d9; --well:#f6f6f6; --wellbd:#e2e2e2; --veil:rgba(255,255,255,.88); --heart:#111111;
  color-scheme:light;
}
:root[data-mono="dark"]{
  --paper:#111111; --ink:#f2f2f2; --sub:#a3a3a3; --line:#333333; --soft:#1c1c1c; --mark:#222222; --wk:#7c7c7c; --band:#2a2a2a; --sheet:#181818;
  --hi:rgba(255,255,255,.07); --sh:rgba(0,0,0,.65); --sh2:rgba(0,0,0,.55);
  --btn1:#2b2b2b; --btn2:#1b1b1b; --bd:#333333; --well:#141414; --wellbd:#2a2a2a; --veil:rgba(0,0,0,.78); --heart:#f2f2f2;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:9px 16px 4px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:1px}
.jump{position:relative;display:inline-flex;align-items:flex-end;gap:4px;cursor:pointer;margin:0;letter-spacing:0;color:var(--ink)}
.jump .caret{font-size:14px;line-height:1;padding-bottom:6px;color:var(--wk)}
.jump input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.qnav{display:flex;gap:8px}
header>*{display:block;line-height:.86;margin:0}
.h1{font-family:var(--body);font-weight:700;font-size:clamp(28px,9vw,40px);letter-spacing:.01em}
.h2{font-family:var(--display);font-stretch:68%;font-weight:900;font-size:clamp(40px,13vw,56px);letter-spacing:-.02em}
.h3{font-family:var(--body);font-weight:900;font-size:clamp(34px,11vw,52px);letter-spacing:-.04em;line-height:1}
.h4{font-family:var(--body);font-weight:700;font-size:clamp(16px,5vw,22px);line-height:1.15}
.h5{font-family:var(--display);font-stretch:62%;font-weight:900;font-size:clamp(48px,15vw,70px);letter-spacing:-.01em}
.rule{border:0;border-top:3px solid var(--ink);margin:6px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 0 4px;font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.k{width:18px;height:18px;display:inline-grid;place-items:center;font-size:10px;border-radius:50%}
.k.hol{background:var(--ink);color:var(--paper)}
.k.brk{border-radius:2px;width:22px;height:8px;background:repeating-linear-gradient(135deg,var(--ink) 0 2px,transparent 2px 5px)}
.k.dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.status{font-size:11px;color:var(--sub);padding-top:2px}

section.month{position:relative;padding-top:0}
section.month+section.month{padding-top:20px}
section.month .mhead{top:0}
section.month+section.month .mhead{top:20px}
.mhead{}
.mhead{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.mnum{font-family:var(--display);font-stretch:62%;font-weight:900;font-size:clamp(120px,40vw,190px);line-height:1;color:var(--mark);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mname{font-family:var(--body);font-weight:900;font-size:16px}
.mold{font-size:11px;color:var(--sub);letter-spacing:.08em;margin-left:auto}
.wm{display:flex;align-items:center;justify-content:flex-end;padding-right:2px;pointer-events:none;z-index:0;overflow:hidden}
.wm .mnum{line-height:.8}
.cell{z-index:1}
.n small{font-size:10px;font-weight:800;margin-right:1px}
.grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:12px;text-align:center;color:var(--sub);padding:2px 0;letter-spacing:.1em}
.dow.wk{color:var(--wk)}
.cell.wk:not(.hol):not(.today) .n{color:var(--wk)}
.cell{position:relative;min-height:41px;border:0;background:none;color:inherit;font:inherit;padding:2px 2px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.cell.empty{cursor:default}
.cell:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.n{width:23px;height:23px;display:grid;place-items:center;border-radius:50%;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.cell.hol .n{background:var(--ink);color:var(--paper);text-decoration:none}
.cell.today{isolation:isolate}
.cell.today::after{content:"";position:absolute;top:0;bottom:0;left:4px;right:4px;background:var(--ink);border-radius:6px;pointer-events:none;z-index:-1}
.cell.today .n,.cell.today.wk .n{color:var(--paper)}
.cell.today.hol .n{background:var(--paper);color:var(--ink)}
.cell.today .has{background:var(--paper)}
.cell.today.brk .bar{border-color:var(--paper)}

.bar{position:absolute;left:0;right:0;top:29px;height:17px;background:transparent;z-index:0;box-sizing:border-box;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.n{position:relative;z-index:1}
.bar.rs-s{left:1px;border-left:1.5px solid var(--ink);border-top-left-radius:8px;border-bottom-left-radius:8px}
.bar.rs-wo{right:2px}
.bar.rs-wi{left:2px}
.bar.rs-e{right:1px;border-right:1.5px solid var(--ink);border-top-right-radius:8px;border-bottom-right-radius:8px}
.cell.rowr{min-height:49px}
.cell.rowr .has{top:35px}
.cell.rowr .cake{top:32.5px}
.moon{font-size:10px;line-height:1}
.tag{font-size:9px;color:var(--sub);line-height:1.2;text-align:center;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 2px}
.has{position:absolute;top:31px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.cake{position:absolute;top:28.5px;left:0;right:0;text-align:center;font-size:11px;line-height:10px;color:var(--heart)}

.list{margin-top:12px;display:grid;gap:4px}
.list:empty{display:none}
.row{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:baseline;font-size:13px;padding:4px 0;border-bottom:1px dotted var(--line);background:none;border-left:0;border-right:0;border-top:0;color:inherit;font-family:inherit;text-align:left;cursor:pointer}
.row .d{font-family:var(--display);font-stretch:75%;font-weight:800;font-variant-numeric:tabular-nums}
.row .t{min-width:0;overflow-wrap:anywhere}
.row .t small{color:var(--sub)}

.note{margin-top:36px;font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px}

/* 下からでるシート */
.veil{position:fixed;inset:0;z-index:50;background:var(--veil);opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--sheet);border:1px solid var(--bd);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -6px 16px var(--sh),0 -1px 3px var(--sh2),inset 0 2px 0 var(--hi),inset 0 -2px 6px var(--sh2);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;max-height:88vh;overflow-y:auto}
.sheet.on{transform:none}
.sh-dow{font-size:14px;color:var(--sub)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{font-size:12px;border:1px solid var(--ink);border-radius:999px;padding:2px 10px}
.chip.fill{background:var(--ink);color:var(--paper)}
.old{font-size:12px;color:var(--sub)}
label{display:block;font-size:12px;letter-spacing:.15em;color:var(--sub);margin:14px 0 4px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
input:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:0;border-color:transparent}
.acts{display:flex;gap:8px;margin-top:14px}
.save{flex:1;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.clear{background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px 16px;font:inherit;font-size:14px;cursor:pointer}
.save:focus-visible,.clear:focus-visible,.close:focus-visible,.row:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chip.btn{cursor:pointer;font:inherit;font-size:12px;background:var(--paper);color:var(--ink)}
.chip.btn.fill{background:var(--ink);color:var(--paper)}
.ib{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:6px;width:38px;height:36px;font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.ib:disabled{opacity:.25;cursor:default}
.ib svg{display:block;flex:none}
.ib:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#pNum{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:14px;line-height:1;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
input[type=date]{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:44px}
.msg{font-size:12px;color:var(--sub);min-height:1.4em;margin-top:6px}
.sh-top{display:flex;align-items:center;gap:5px}
.sh-top .ib{width:34px;height:34px;font-size:18px}
.sh-head{display:flex;align-items:baseline;gap:3px;flex:none;width:auto;overflow:hidden;padding:0 2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sh-head #shDate{font-size:22px;display:inline-flex;font-variant-numeric:tabular-nums}
#shDate .mo,#shDate .dy{display:inline-block;width:2ch}
#shDate .mo{text-align:right}
#shDate .dy{text-align:left}
#shDate .sl{padding:0 1px}
.sh-head #shDow{text-align:center;font-family:var(--display);font-stretch:75%;font-weight:800}
.sh-head .sh-hol{flex:none;white-space:nowrap}
.sh-head .sh-hol:empty{display:none}
.sh-head .sh-hol b{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;height:16px;font-weight:700;font-size:9px;line-height:1;padding:1px 4px 0;border:1px solid var(--ink);border-radius:4px;vertical-align:2px}
.sh-head.sh-rest{width:auto;flex:1 1 auto;min-width:0}
.sh-head .sh-tail{margin-left:2px;display:flex;align-items:baseline;gap:6px;overflow:hidden}
.sh-head #shOld{font-size:13px;flex:none}
.sh-date{font-family:var(--body);font-weight:900;font-size:24px;letter-spacing:-.02em}
.sh-top .close{margin-left:0}
.sh-rule{border:0;border-top:1px solid var(--ink);margin:8px 0 0}
.tools{display:flex;align-items:center;gap:6px;margin-top:10px}
.tools .sec{font-size:12px;letter-spacing:.15em;color:var(--sub)}
.pager{display:flex;align-items:center;gap:4px;margin-left:6px}
.dlist{display:flex;flex-direction:column;gap:8px;margin-top:12px;min-height:150px}
.drow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--ink);padding:10px 12px;border-radius:8px;cursor:pointer;background:linear-gradient(145deg,var(--btn1),var(--btn2));border:1px solid var(--bd);box-shadow:3px 3px 6px var(--sh),-2px -2px 5px var(--hi),inset 0 1px 0 var(--hi)}
.drow:active{box-shadow:inset 2px 2px 5px var(--sh),inset -2px -2px 4px var(--hi)}
.drow .mk{flex:none;width:22px;display:grid;place-items:center}
.drow .mk .d{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.drow .mk .h{color:var(--heart);font-size:13px;line-height:1}
.drow .mk .r{width:20px;height:10px;border:1.5px solid var(--ink);border-radius:5px}
.drow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.drow .pd{flex:none;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:14px;color:var(--sub)}
.drow .go{flex:none;color:var(--wk)}
.drow.add{justify-content:center;font-weight:700}
.sttl{font-size:12px;letter-spacing:.15em;color:var(--sub);margin-top:16px}
.setrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.setrow label.ib{margin:0;color:var(--ink)}
.themes{display:flex;align-items:center;gap:10px}
.themes .sw{flex:none}
.sw{width:40px;height:40px;border-radius:8px;cursor:pointer;padding:0;border:1.5px solid #8e8e8e;box-shadow:2px 2px 5px var(--sh)}
.sw.w{background:#ffffff}.sw.b{background:#111111}
.sw.on{outline:2.5px solid var(--ink);outline-offset:3px}
/* 写真のはいけい：画面にとまったまま。上にテーマの色をうすくかけて、字を読みやすく */
#bgPhoto{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat;pointer-events:none}
#bgPhoto::after{content:"";position:absolute;inset:0;background:var(--paper);opacity:.5}
#bgPhoto[hidden]{display:none}
:root.photo[data-mono="dark"]{--mark:rgba(255,255,255,.2)}
.sw.ph{position:relative;background:var(--well) center/cover no-repeat;display:grid;place-items:center;color:var(--sub)}
.sw.ph.phset{color:transparent}
label.sw.ph{margin:0;overflow:hidden}
.setrow label.ib{position:relative;overflow:hidden}
.fpick{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
.ib.sm2{width:30px;height:30px;font-size:15px;align-self:center}
.dempty{color:var(--sub);font-size:13px;text-align:center;padding:8px 0}
.tools #pAdd{margin-left:6px}
.ib.sm{width:30px;height:30px;font-size:16px;border-color:var(--line)}
.kind{display:flex;align-items:center;gap:8px;margin:8px 0}
.seg{display:inline-flex;flex:none;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:4px 12px;border:0;background:var(--paper);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:disabled{cursor:default}
.span{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
.span.off{visibility:hidden}
.dbox{position:relative;flex:none;width:64px;display:flex;align-items:center;justify-content:center;min-height:34px;margin:0;letter-spacing:0;color:var(--ink);font-family:var(--display);font-stretch:75%;font-weight:800;font-size:16px;border-radius:6px;background:var(--well);border:1px solid var(--wellbd);box-shadow:inset 2px 2px 5px var(--sh2),inset -2px -2px 4px var(--hi);cursor:pointer}
.dbox input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0;min-height:0}
#inPlan{margin-bottom:8px}
textarea{min-height:72px}
@media (prefers-reduced-motion:reduce){.sheet,.veil{transition:none}}
/* 凸：おせるもの　凹：書くところ（これまでのアプリと同じ考え方） */
.ib,.seg button{background:linear-gradient(145deg,var(--btn1),var(--btn2));border:1px solid var(--bd);box-shadow:3px 3px 6px var(--sh),-2px -2px 5px var(--hi),inset 0 1px 0 var(--hi);transition:box-shadow .12s,transform .12s}
.ib:active:not(:disabled),.seg button:active:not(:disabled){box-shadow:inset 2px 2px 5px var(--sh),inset -2px -2px 4px var(--hi);transform:translateY(1px)}
.seg{border:0;gap:6px;overflow:visible}
.seg button{border-radius:6px}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:inset 2px 2px 5px rgba(0,0,0,.45),inset -1px -1px 2px rgba(255,255,255,.12)}
.ib:disabled{box-shadow:none;background:var(--well)}
input[type=text],textarea,input[type=date]{background:var(--well);border:1px solid var(--wellbd);box-shadow:inset 2px 2px 5px var(--sh2),inset -2px -2px 4px var(--hi)}
#pNum{padding:4px 8px;border-radius:6px;background:var(--well);box-shadow:inset 2px 2px 4px var(--sh2),inset -2px -2px 3px var(--hi)}
@media (prefers-reduced-motion:reduce){.ib,.seg button{transition:none}}
/* さがす */
.fbox{position:relative;margin-top:12px}
.fbox svg{position:absolute;left:12px;top:50%;margin-top:-9px;color:var(--sub);pointer-events:none}
#fq{padding-left:38px}
.fcount{font-size:12px;color:var(--sub);margin-top:8px;min-height:1.4em}
.fsec{font-size:12px;letter-spacing:.15em;color:var(--sub);margin:14px 0 2px}
.flist{display:flex;flex-direction:column;gap:8px;margin-top:6px;min-height:120px}
.drow .fd{flex:none;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:74px}
.drow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.drow .tx .nm{flex:none}
.drow .sn{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .mk .hb{font-size:9px;font-weight:700;border:1px solid var(--ink);border-radius:4px;padding:0 3px;line-height:14px}
.drow mark{background:none;color:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
</style>

<div id="bgPhoto" hidden></div>
<div class="wrap">
  <header class="top">
    <label class="jump" for="jumpTo"><span class="h2" id="yr">2026</span><span class="caret">▾</span>
      <input type="month" id="jumpTo" aria-label="はじめの月をえらぶ"></label>
    <div class="qnav">
      <button type="button" id="qPrev" class="ib" aria-label="前の3か月"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>

<script>
(function(){
// 祝日・月の満ち欠け・旧暦を、年をこえて計算する
const D2R=Math.PI/180;
const sinD=x=>Math.sin(x*D2R), cosD=x=>Math.cos(x*D2R);
const norm=x=>((x%360)+360)%360;
const pad2=n=>String(n).padStart(2,"0");
const ymd=(y,m,d)=>`${y}-${pad2(m)}-${pad2(d)}`;
const utc=(y,m,d)=>new Date(Date.UTC(y,m-1,d));
const fromUTC=dt=>ymd(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate());
const addDays=(s,n)=>{const[a,b,c]=s.split("-").map(Number);const d=utc(a,b,c);d.setUTCDate(d.getUTCDate()+n);return fromUTC(d);};
const dow=s=>{const[a,b,c]=s.split("-").map(Number);return utc(a,b,c).getUTCDay();};

// --- 祝日（いまの法律のきまり：2020年以降）
const holCache={};
function nthMonday(y,m,n){const f=utc(y,m,1).getUTCDay();return 1+((8-f)%7)+(n-1)*7;}
function holidays(y){
  if(holCache[y]) return holCache[y];
  const h={};
  const put=(m,d,n)=>{h[ymd(y,m,d)]=n;};
  const k=y-1980;
  put(1,1,"元日"); put(1,nthMonday(y,1,2),"成人の日"); put(2,11,"建国記念の日"); put(2,23,"天皇誕生日");
  put(3,Math.floor(20.8431+0.242194*k-Math.floor(k/4)),"春分の日");
  put(4,29,"昭和の日"); put(5,3,"憲法記念日"); put(5,4,"みどりの日"); put(5,5,"こどもの日");
  put(7,nthMonday(y,7,3),"海の日"); put(8,11,"山の日"); put(9,nthMonday(y,9,3),"敬老の日");
  put(9,Math.floor(23.2488+0.242194*k-Math.floor(k/4)),"秋分の日");
  put(10,nthMonday(y,10,2),"スポーツの日"); put(11,3,"文化の日"); put(11,23,"勤労感謝の日");
  // 国民の休日（祝日にはさまれた日）
  for(const s of Object.keys(h)){const n2=addDays(s,2); if(h[n2]&&!h[addDays(s,1)]&&dow(addDays(s,1))!==0) h[addDays(s,1)]="国民の休日";}
  // 振替休日（日曜の祝日 → 次の祝日でない日）
  for(const s of Object.keys(h).sort()){ if(dow(s)===0){ let t=addDays(s,1); while(h[t]) t=addDays(t,1); h[t]="振替休日"; } }
  return holCache[y]=h;
}

// --- 新月・満月（Meeusの方法）。戻り値はユリウス日（TT）
function moonPhaseJDE(k){
  const T=k/1236.85, T2=T*T, T3=T2*T, T4=T3*T;
  let jde=2451550.09766+29.530588861*k+0.00015437*T2-0.000000150*T3+0.00000000073*T4;
  const E=1-0.002516*T-0.0000074*T2;
  const M=norm(2.5534+29.10535670*k-0.0000014*T2-0.00000011*T3);
  const Mp=norm(201.5643+385.81693528*k+0.0107582*T2+0.00001238*T3-0.000000058*T4);
  const F=norm(160.7108+390.67050284*k-0.0016118*T2-0.00000227*T3+0.000000011*T4);
  const Om=norm(124.7746-1.56375588*k+0.0020672*T2+0.00000215*T3);
  const full=Math.abs(k-Math.round(k)-0.5)<1e-6;
  let c;
  if(!full){
    c=-0.40720*sinD(Mp)+0.17241*E*sinD(M)+0.01608*sinD(2*Mp)+0.01039*sinD(2*F)+0.00739*E*sinD(Mp-M)
      -0.00514*E*sinD(Mp+M)+0.00208*E*E*sinD(2*M)-0.00111*sinD(Mp-2*F)-0.00057*sinD(Mp+2*F)
      +0.00056*E*sinD(2*Mp+M)-0.00042*sinD(3*Mp)+0.00042*E*sinD(M+2*F)+0.00038*E*sinD(M-2*F)
      -0.00024*E*sinD(2*Mp-M)-0.00017*sinD(Om)-0.00007*sinD(Mp+2*M)+0.00004*sinD(2*Mp-2*F)
      +0.00004*sinD(3*M)+0.00003*sinD(Mp+M-2*F)+0.00003*sinD(2*Mp+2*F)-0.00003*sinD(Mp+M+2*F)
      +0.00003*sinD(Mp-M+2*F)-0.00002*sinD(Mp-M-2*F)-0.00002*sinD(3*Mp+M)+0.00002*sinD(4*Mp);
  } else {
    c=-0.40614*sinD(Mp)+0.17302*E*sinD(M)+0.01614*sinD(2*Mp)+0.01043*sinD(2*F)+0.00734*E*sinD(Mp-M)
      -0.00515*E*sinD(Mp+M)+0.00209*E*E*sinD(2*M)-0.00111*sinD(Mp-2*F)-0.00057*sinD(Mp+2*F)
      +0.00056*E*sinD(2*Mp+M)-0.00042*sinD(3*Mp)+0.00042*E*sinD(M+2*F)+0.00038*E*sinD(M-2*F)
      -0.00024*E*sinD(2*Mp-M)-0.00017*sinD(Om)-0.00007*sinD(Mp+2*M)+0.00004*sinD(2*Mp-2*F)
      +0.00004*sinD(3*M)+0.00003*sinD(Mp+M-2*F)+0.00003*sinD(2*Mp+2*F)-0.00003*sinD(Mp+M+2*F)
      +0.00003*sinD(Mp-M+2*F)-0.00002*sinD(Mp-M-2*F)-0.00002*sinD(3*Mp+M)+0.00002*sinD(4*Mp);
  }
  const A=[299.77+0.107408*k-0.009173*T2,251.88+0.016321*k,251.83+26.651886*k,349.42+36.412478*k,84.66+18.206239*k,
    141.74+53.303771*k,207.14+2.453732*k,154.84+7.306860*k,34.52+27.261239*k,207.19+0.121824*k,291.34+1.844379*k,
    161.72+24.198154*k,239.56+25.513099*k,331.55+3.592518*k];
  const W=[0.000325,0.000165,0.000164,0.000126,0.000110,0.000062,0.000060,0.000056,0.000047,0.000042,0.000040,0.000037,0.000035,0.000023];
  let add=0; for(let i=0;i<14;i++) add+=W[i]*sinD(A[i]);
  return jde+c+add;
}
// ユリウス日 → 日本時間の日付（TT→UTCは約69秒。日付には影響が小さいので引く）
const jdToJST=jd=>fromUTC(new Date((jd-2440587.5)*864e5-69e3+9*3600e3));
const jstMidnightJD=s=>{const[a,b,c]=s.split("-").map(Number);return Date.UTC(a,b-1,c)/864e5+2440587.5-9/24;};

const phaseCache={};
function phases(y){ // その年の前後をふくむ新月・満月の日（日本時間）
  if(phaseCache[y]) return phaseCache[y];
  const k0=Math.floor((y-1-2000)*12.3685), news=[], fulls=[], newJD=[];
  for(let k=k0;k<k0+40;k++){ const j=moonPhaseJDE(k); news.push(jdToJST(j)); newJD.push(j); fulls.push(jdToJST(moonPhaseJDE(k+0.5))); }
  return phaseCache[y]={news,fulls,newJD};
}
// --- 太陽の黄経（見かけ）
function sunLon(jd){
  const T=(jd-2451545)/36525;
  const L0=280.46646+36000.76983*T+0.0003032*T*T, M=357.52911+35999.05029*T-0.0001537*T*T;
  const C=(1.914602-0.004817*T-0.000014*T*T)*sinD(M)+(0.019993-0.000101*T)*sinD(2*M)+0.000289*sinD(3*M);
  return norm(L0+C-0.00569-0.00478*sinD(125.04-1934.136*T));
}
// --- 旧暦 {m, d, leap}
function lunar(s){
  const y=Number(s.slice(0,4)), {news}=phases(y);
  let i=-1; for(let j=0;j<news.length;j++){ if(news[j]<=s) i=j; else break; }
  if(i<0||i+1>=news.length) return null;
  const start=news[i], next=news[i+1];
  const day=Math.round((jstMidnightJD(s)-jstMidnightJD(start)))+1;
  const monthOf=(a,b)=>{ // a〜bの月にふくまれる中気の番号
    const l1=sunLon(jstMidnightJD(a)), l2=sunLon(jstMidnightJD(b));
    const z1=Math.floor(l1/30), z2=Math.floor(l2/30);
    if(z1===z2) return null; return ((z2+1)%12)+1;
  };
  let m=monthOf(start,next), leap=false;
  if(m===null){ leap=true; let p=i-1; while(p>=0){ const mm=monthOf(news[p],news[p+1]); if(mm!==null){m=mm;break;} p--; } }
  return {m,d:day,leap};
}
const isNewMoon=s=>phases(Number(s.slice(0,4))).news.includes(s);
const isFullMoon=s=>phases(Number(s.slice(0,4))).fulls.includes(s);


const _t=new Date(); const TODAY=`${_t.getFullYear()}-${String(_t.getMonth()+1).padStart(2,"0")}-${String(_t.getDate()).padStart(2,"0")}`;
const DOW=["日","月","火","水","木","金","土"];
const HOLOF=s=>holidays(Number(s.slice(0,4)))[s];
let qY=Number(TODAY.slice(0,4)), qM=Math.floor((Number(TODAY.slice(5,7))-1)/3)*3+1; // 表示している3か月
const pad=n=>String(n).padStart(2,"0");
const key=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const toDate=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(Date.UTC(a,b-1,c));};
const md=s=>`${Number(s.slice(5,7))}/${Number(s.slice(8))}`;
function info(s){
  const o=lunar(s); const tags=[]; const hn=HOLOF(s);
  if(hn) tags.push({t:hn,fill:true});
  const moon=isNewMoon(s)?"🌑":(isFullMoon(s)?"🌕":"");
  return {o,tags,moon};
}

let items={};    // id -> {date,plan,memo}  1日の予定
let ranges={};   // id -> {title,memo,from,to}  期間の予定
let store=null;
const rangesOn=s=>Object.entries(ranges).filter(([id,r])=>r.from<=s&&s<=r.to).sort((a,b)=>a[1].from<b[1].from?-1:1);
const itemsOn=s=>Object.entries(items).filter(([id,v])=>v.date===s).sort((a,b)=>a[0]<b[0]?-1:1);
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function render(){
  const root=document.getElementById("months"); root.innerHTML="";
  const endM=qM+2;
  $("yr").textContent=endM>12?`${qY}–${String(qY+1).slice(2)}`:qY;
  try{ $("jumpTo").value=`${qY}-${pad(qM)}`; }catch(e){}
  // 3か月を1つの表につなげる（31日のつぎは、すぐ1日）
  const sec=document.createElement("section"); sec.className="month";
  const g=document.createElement("div"); g.className="grid";
  const start=key(qY,qM,1);
  const lead=new Date(Date.UTC(qY,qM-1,1)).getUTCDay();
  // 重なる期間の予定は、別の段（レーン）にならべる
  const laneOf={}; const laneEnd=[];
  Object.entries(ranges).sort((a,b)=>a[1].from<b[1].from?-1:a[1].from>b[1].from?1:(a[1].to>b[1].to?-1:1)).forEach(([id,r])=>{
    let L=laneEnd.findIndex(e=>e<r.from); if(L<0){L=laneEnd.length;laneEnd.push(r.to);} else laneEnd[L]=r.to; laneOf[id]=L; });
  const rowLanes={};
  let idx=lead;
  for(let k=0;k<3;k++){
    let m=qM+k, Y=qY; if(m>12){m-=12;Y++;}
    const days=new Date(Date.UTC(Y,m,0)).getUTCDate();
    const r1=Math.floor(idx/7), r2=Math.floor((idx+days-1)/7);
    const wm=document.createElement("div"); wm.className="wm";
    wm.style.gridRow=`${r1+1} / ${r2+2}`; wm.style.gridColumn="1 / -1";
    wm.innerHTML=`<span class="mnum">${m}</span>`; g.appendChild(wm);
    for(let d=1;d<=days;d++,idx++){
      const s=key(Y,m,d), inf=info(s), wd=idx%7, rs=rangesOn(s), its=itemsOn(s);
      const b=document.createElement("button"); b.type="button";
      b.style.gridRow=String(Math.floor(idx/7)+1); b.style.gridColumn=String(wd+1);
      let cls="cell"; if(wd===6)cls+=" wk"; if(HOLOF(s))cls+=" hol";
      if(rs.length)cls+=" brk"; if(s===TODAY)cls+=" today"; if(d===1&&k>0)cls+=" m1";
      b.className=cls;
      let bars="";

  const isNew=pi>=pages.length, p=isNew?null:pages[pi];

      if(isNew&&!plan&&!memo) return true;
      if(!from||!to){$("msg").textContent="開始と終了の日を選んでください。";return false;}
      if(from>to){$("msg").textContent="終了の日は、開始の日より後にしてください。";return false;}
      if(!plan){$("msg").textContent="予定の名前を入れてください（例：旅行）。";return false;}
      if(p&&p.kind==="item"){ await store.removeItem(p.id); delete items[p.id]; }
      const id=(p&&p.kind==="range")?p.id:newId("r-");
      await store.saveRange(id,{kind:"range",title:plan,memo,from,to}); ranges[id]={title:plan,memo,from,to};
    } else {
      if(!plan&&!memo){ if(p&&p.kind==="item"){ await store.removeItem(p.id); delete items[p.id]; } else if(p){ $("msg").textContent="予定かメモを入れてください。"; return false; } render(); return true; }
      if(p&&p.kind==="range"){ await store.removeRange(p.id); delete ranges[p.id]; }
      const id=(p&&p.kind==="item")?p.id:newId("i-");
      await store.saveItem(id,{kind:"item",date:cur,plan,memo}); items[id]={date:cur,plan,memo};

function hiTxt(t,q){ // 見つかったところに下線
  const raw=String(t), low=kana(raw); if(!q||low.length!==raw.length) return esc(raw);
  let out="", i=0, j;
  while((j=low.indexOf(q,i))>=0){ out+=esc(raw.slice(i,j))+"<mark>"+esc(raw.slice(j,j+q.length))+"</mark>"; i=j+q.length; }
  return out+esc(raw.slice(i));
}
function snip(t,q){ // メモの中の、見つかったあたりだけ出す
  const one=String(t).replace(/\s+/g," "); const j=kana(one).indexOf(q);

(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    const col=db.collection("data/users/"+uid);
    storeMode="account";
    store={
      savePref:async(o)=>{await col.doc("pref").set(o);},
      saveItem:async(id,o)=>{await col.doc(id).set(o);}, removeItem:async(id)=>{await col.doc(id).delete();},
      saveRange:async(id,o)=>{await col.doc(id).set(o);}, removeRange:async(id)=>{await col.doc(id).delete();}
    };
    col.onSnapshot(snap=>{
      const ni={}, nr={};
      snap.docs.forEach(d=>{ if(!d.exists) return; const v=d.data();
        if(d.id==="seed") return;
        if(d.id==="pref"){ if(v.theme&&v.theme!==theme){ theme=applyTheme(v.theme); } return; }
        if(v.kind==="range"){nr[d.id]={title:v.title||"",memo:v.memo||"",from:v.from,to:v.to};return;}
        const date=v.date||(/^\d{4}-\d\d-\d\d$/.test(d.id)?d.id:null);
        if(date&&(v.plan||v.memo)) ni[d.id]={date,plan:v.plan||"",memo:v.memo||""}; });
      items=ni; ranges=nr; render();
      if(cur&&$("sheet").classList.contains("on")&&!busy){ /* 開いている間は表示をそのままにする */ }
    },()=>{});
  }catch(e){}
})();
})();
</script>

</body></html>
